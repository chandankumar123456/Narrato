<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920,height=1080"/>
<title>Slide</title>
<style>
/*
 * Narrato slide stylesheet — deterministic, no Tailwind, no external assets.
 * Themes: data-theme on .slide (dark_modern | minimal_light | bold_gradient)
 */

/* ── Reset & base ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
}

.slide {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
}

.slide-frame {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 5.5rem 6rem 3rem;
}

/* ── Theme: dark_modern ───────────────────────────────────────────── */
.slide[data-theme="dark_modern"] {
  background: linear-gradient(145deg, #000000 0%, #0a0a0f 45%, #111827 100%);
  color: #ffffff;
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.72);
  --text-muted: rgba(255, 255, 255, 0.42);
  --card-bg: rgba(255, 255, 255, 0.07);
  --card-border: rgba(255, 255, 255, 0.12);
  --card-shadow: 0 25px 50px -12px rgba(139, 92, 246, 0.12);
  --card-highlight-bg: rgba(255, 255, 255, 0.11);
  --card-highlight-border: rgba(255, 255, 255, 0.2);
  --accent: #c4b5fd;
  --accent-line: linear-gradient(90deg, #a855f7, #ec4899);
  --accent-glow: 0 10px 40px rgba(168, 85, 247, 0.2);
  --title-grad: linear-gradient(90deg, #ffffff 0%, #e9d5ff 45%, #c4b5fd 100%);
  --stat-color: #c4b5fd;
  --step-bg: linear-gradient(135deg, #a855f7, #ec4899);
  --step-connector: linear-gradient(180deg, rgba(168, 85, 247, 0.55), transparent);
  --divider: rgba(255, 255, 255, 0.12);
  --visual-mesh: radial-gradient(ellipse 80% 60% at 70% 40%, rgba(168, 85, 247, 0.25), transparent 55%),
                  radial-gradient(ellipse 50% 50% at 30% 80%, rgba(236, 72, 153, 0.15), transparent 50%);
}

/* ── Theme: minimal_light ─────────────────────────────────────────── */
.slide[data-theme="minimal_light"] {
  background: linear-gradient(160deg, #ffffff 0%, #f9fafb 50%, #e2e8f0 100%);
  color: #111827;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --card-bg: #ffffff;
  --card-border: rgba(229, 231, 235, 0.9);
  --card-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.08);
  --card-highlight-bg: rgba(238, 242, 255, 0.95);
  --card-highlight-border: rgba(199, 210, 254, 0.8);
  --accent: #4f46e5;
  --accent-line: linear-gradient(90deg, #6366f1, #8b5cf6);
  --accent-glow: 0 10px 30px rgba(99, 102, 241, 0.15);
  --title-grad: linear-gradient(90deg, #111827 0%, #312e81 40%, #4f46e5 100%);
  --stat-color: #4f46e5;
  --step-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
  --step-connector: linear-gradient(180deg, rgba(99, 102, 241, 0.4), transparent);
  --divider: #e5e7eb;
  --visual-mesh: radial-gradient(ellipse 70% 50% at 75% 35%, rgba(99, 102, 241, 0.12), transparent 50%),
                  radial-gradient(ellipse 40% 40% at 20% 70%, rgba(139, 92, 246, 0.08), transparent 50%);
}

/* ── Theme: bold_gradient ─────────────────────────────────────────── */
.slide[data-theme="bold_gradient"] {
  background: linear-gradient(145deg, #1e1b4b 0%, #581c87 50%, #9d174d 100%);
  color: #ffffff;
  --text-primary: #ffffff;
  --text-secondary: rgba(252, 231, 243, 0.85);
  --text-muted: rgba(251, 207, 232, 0.45);
  --card-bg: rgba(255, 255, 255, 0.1);
  --card-border: rgba(255, 255, 255, 0.15);
  --card-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.15);
  --card-highlight-bg: rgba(255, 255, 255, 0.16);
  --card-highlight-border: rgba(255, 255, 255, 0.28);
  --accent: #fbcfe8;
  --accent-line: linear-gradient(90deg, #f472b6, #fbbf24);
  --accent-glow: 0 10px 40px rgba(244, 114, 182, 0.25);
  --title-grad: linear-gradient(90deg, #ffffff 0%, #fce7f3 40%, #fde68a 100%);
  --stat-color: #fbcfe8;
  --step-bg: linear-gradient(135deg, #ec4899, #f59e0b);
  --step-connector: linear-gradient(180deg, rgba(244, 114, 182, 0.5), transparent);
  --divider: rgba(255, 255, 255, 0.15);
  --visual-mesh: radial-gradient(ellipse 75% 55% at 65% 45%, rgba(244, 114, 182, 0.3), transparent 55%),
                  radial-gradient(ellipse 45% 45% at 25% 75%, rgba(251, 191, 36, 0.12), transparent 50%);
}

/* ── Typography scale (hierarchy) ──────────────────────────────────── */
.slide-title-display {
  margin: 0;
  font-size: 5.5rem;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.03em;
  background: var(--title-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  max-width: 22ch;
}

.slide[data-theme="minimal_light"] .slide-title-display {
  color: #111827;
  -webkit-background-clip: unset;
  background-clip: unset;
  background: var(--title-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.slide-subtitle-hero {
  margin: 2rem auto 0;
  max-width: 42rem;
  font-size: 1.5rem;
  font-weight: 300;
  line-height: 1.55;
  color: var(--text-secondary);
}

.slide-title-section {
  margin: 0;
  font-size: 3.75rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.1;
  background: var(--title-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.slide[data-theme="minimal_light"] .slide-title-section {
  background: var(--title-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.slide-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

.slide-body {
  font-size: 1.25rem;
  line-height: 1.6;
  color: var(--text-secondary);
}

.slide-body-lg {
  font-size: 1.35rem;
  line-height: 1.55;
  font-weight: 500;
  color: var(--text-secondary);
}

.slide-body-sm {
  font-size: 1.05rem;
  line-height: 1.55;
  color: var(--text-secondary);
}

.stat-value {
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--stat-color);
}

.stat-value--lead {
  font-size: 4.5rem;
  line-height: 1;
}

.stat-value--support {
  font-size: 3rem;
  line-height: 1.1;
}

.stat-label {
  color: var(--text-secondary);
}

.stat-label--lead {
  font-size: 1.25rem;
  font-weight: 500;
}

.stat-label--support {
  font-size: 1rem;
  color: var(--text-muted);
}

/* ── Accents (scarce — one primary bar per region) ─────────────────── */
.accent-bar {
  width: 4rem;
  height: 0.35rem;
  border-radius: 9999px;
  background: var(--accent-line);
}

.accent-bar--sm {
  width: 2.5rem;
  height: 0.2rem;
  opacity: 0.45;
}

.section-head {
  margin-bottom: 3.5rem;
}

.section-head .accent-bar {
  margin-bottom: 1.5rem;
}

/* ── Layout: hero ─────────────────────────────────────────────────── */
.layout-hero {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.layout-hero-inner {
  text-align: center;
  max-width: 56rem;
  margin: 0 auto;
}

.layout-hero .accent-bar {
  margin: 0 auto 2.5rem;
}

.hero-accent-terminator {
  margin-top: 3rem;
}

.layout-hero .accent-bar--bottom {
  margin: 3rem auto 0;
}

/* ── Layout: grid cards ─────────────────────────────────────────────── */
.layout-grid {
  width: 100%;
  max-width: 72rem;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.grid-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  align-items: stretch;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 1.25rem;
  padding: 2rem;
  box-shadow: var(--card-shadow);
}

.card--focal {
  grid-column: span 2;
  background: var(--card-highlight-bg);
  border-color: var(--card-highlight-border);
  border-radius: 1.75rem;
  padding: 2.5rem;
  box-shadow: var(--card-shadow), var(--accent-glow);
}

.card--focal .accent-bar {
  margin-bottom: 1.5rem;
}

/* ── Layout: stats ────────────────────────────────────────────────── */
.layout-stats {
  width: 100%;
  max-width: 72rem;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.stat-cell {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 1.25rem;
  padding: 2rem;
  text-align: center;
  box-shadow: var(--card-shadow);
}

.stat-cell--lead {
  grid-column: span 2;
  background: var(--card-highlight-bg);
  border-color: var(--card-highlight-border);
  border-radius: 1.75rem;
  padding: 2.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow), var(--accent-glow);
}

.stat-cell--lead::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--accent-line);
}

.stat-cell--lead .stat-value { margin-bottom: 1rem; }

/* ── Layout: split (text + visual panel, no image) ────────────────── */
.layout-split {
  display: flex;
  width: 100%;
  max-width: 80rem;
  margin: 0 auto;
  gap: 4rem;
  flex: 1;
  align-items: center;
}

.split-left {
  flex: 1;
  max-width: 36rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.split-left .accent-bar {
  margin-bottom: 2rem;
}

.split-left .slide-title-section {
  margin-bottom: 1.5rem;
}

.split-bullet-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.split-bullet-list li {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 1rem;
  font-size: 1.125rem;
  line-height: 1.55;
  color: var(--text-secondary);
}

.split-bullet-list .bullet-dot {
  color: var(--accent);
  font-size: 1.25rem;
  line-height: 1.4;
  flex-shrink: 0;
}

.split-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 22rem;
}

.split-visual {
  width: 100%;
  max-width: 36rem;
  min-height: 24rem;
  border-radius: 1.75rem;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

.split-visual::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--visual-mesh);
  pointer-events: none;
}

.split-visual-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  height: 100%;
}

.mini-card {
  background: var(--card-highlight-bg);
  border: 1px solid var(--card-highlight-border);
  border-radius: 1rem;
  padding: 1.25rem 1.5rem;
  font-size: 1.05rem;
  line-height: 1.5;
  color: var(--text-secondary);
  box-shadow: var(--accent-glow);
}

.mini-card--quote {
  font-size: 1.15rem;
  font-style: italic;
  font-weight: 500;
  color: var(--text-primary);
  border-left: 4px solid transparent;
  border-image: var(--accent-line) 1;
  border-left-width: 4px;
  border-image-slice: 1;
}

.visual-abstract {
  flex: 1;
  min-height: 10rem;
  border-radius: 1.25rem;
  background: var(--visual-mesh), var(--card-bg);
  border: 1px dashed var(--card-border);
}

/* ── Layout: step flow ──────────────────────────────────────────────── */
.layout-steps {
  width: 100%;
  max-width: 64rem;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.steps-stack {
  display: flex;
  flex-direction: column;
}

.step-row {
  display: flex;
  flex-direction: column;
}

.step-card {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  border-radius: 1.25rem;
  padding: 1.75rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
}

.step-card--focal {
  background: var(--card-highlight-bg);
  border-color: var(--card-highlight-border);
  box-shadow: var(--card-shadow), var(--accent-glow);
}

.step-num {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  background: var(--step-bg);
  border-radius: 0.75rem;
  box-shadow: var(--accent-glow);
}

.step-num--lg {
  width: 3.5rem;
  height: 3.5rem;
  font-size: 1.25rem;
}

.step-num--sm {
  width: 2.75rem;
  height: 2.75rem;
  font-size: 1.05rem;
}

.step-connector {
  width: 2px;
  height: 1.5rem;
  margin: 0 auto;
  background: var(--step-connector);
}

/* ── Layout: timeline ──────────────────────────────────────────────── */
.layout-timeline {
  width: 100%;
  max-width: 56rem;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.timeline-stack {
  display: flex;
  flex-direction: column;
  padding-left: 1rem;
}

.timeline-row {
  display: flex;
  align-items: stretch;
  gap: 2rem;
}

.timeline-spine {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 0.5rem;
}

.timeline-node {
  border-radius: 9999px;
  flex-shrink: 0;
  background: var(--step-bg);
  box-shadow: var(--accent-glow);
}

.timeline-node--lg {
  width: 1.25rem;
  height: 1.25rem;
}

.timeline-node--sm {
  width: 0.875rem;
  height: 0.875rem;
}

.timeline-line {
  width: 2px;
  flex: 1;
  min-height: 2rem;
  background: var(--accent-line);
  opacity: 0.35;
}

.timeline-date {
  display: inline-block;
  color: #fff;
  background: var(--step-bg);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.35rem 1rem;
  border-radius: 9999px;
  margin-bottom: 0.75rem;
}

.timeline-text--lead {
  font-size: 1.25rem;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.55;
  margin: 0;
}

.timeline-text {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.55;
  margin: 0;
}

.timeline-body {
  padding-bottom: 2.5rem;
}

</style>
</head>
<body>
<div class="slide" data-theme="dark_modern">
<div class="slide-frame">
<div class="layout-timeline">
  <div class="section-head">
    <div class="accent-bar"></div>
    <h2 class="slide-title-section">Roadmap</h2>
  </div>
  <div class="timeline-stack">
    <div class="timeline-row">
      <div class="timeline-spine">
        <div class="timeline-node timeline-node--lg"></div>
        <div class="timeline-line"></div>
      </div>
      <div class="timeline-body">
        <div class="timeline-date">Q1 2026</div>
        <p class="timeline-text--lead">Beta launch</p>
      </div>
    </div>
    <div class="timeline-row">
      <div class="timeline-spine">
        <div class="timeline-node timeline-node--sm"></div>
        <div class="timeline-line"></div>
      </div>
      <div class="timeline-body">
        <div class="timeline-date">Q2 2026</div>
        <p class="timeline-text">Enterprise release</p>
      </div>
    </div>
    <div class="timeline-row">
      <div class="timeline-spine">
        <div class="timeline-node timeline-node--sm"></div>
        
      </div>
      <div class="timeline-body">
        <div class="timeline-date">Q4 2026</div>
        <p class="timeline-text">Global expansion</p>
      </div>
    </div>
  </div>
</div>
</div>
</div>
</body>
</html>
