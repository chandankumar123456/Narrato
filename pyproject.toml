[project]
name = "narrato"
version = "0.1.0"
description = "Narrato is an AI-powered storytelling and presentation generator that transforms simple prompts into structured, visually engaging slides and narratives in seconds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "openai>=2.30.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]
