[project]
name = "narrato"
version = "0.1.0"
description = "Narrato is an AI-powered storytelling and presentation generator that transforms simple prompts into structured, visually engaging slides and narratives in seconds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]
